version: '3.8'

services:
  db:
    image: postgres:15
    container_name: bharatverify_db
    environment:
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: verify_password
      POSTGRES_DB: bharatverify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat -d bharatverify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
