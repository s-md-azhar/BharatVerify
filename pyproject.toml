[tool.poetry]
name = "bharatverify"
version = "0.1.0"
description = "A realistic, production-oriented AI-powered KYC/identity verification platform."
authors = ["s-md-azhar <azhar@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = "^2.8.0"
sqlalchemy = "^2.0.31"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
langgraph = "^0.1.0"
google-genai = "^0.1.2"
torch = "2.3.1"
torchvision = "0.18.1"
sentence-transformers = "^3.0.1"
paddlepaddle = "^2.6.1"
paddleocr = "^2.8.0"
opencv-python = "^4.10.0"
scikit-learn = "^1.5.0"
mcp = "^0.1.0"
numpy = "^1.26.4"
faiss-cpu = "^1.8.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
