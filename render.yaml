services:
  - type: web
    name: bharatverify-api
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/run_migrations.py"
    startCommand: "uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bharatverify-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODEL
        value: bge-m3

databases:
  - name: bharatverify-db
    databaseName: bharatverify
    user: bharatverify
