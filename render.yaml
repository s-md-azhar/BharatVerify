services:
  - type: web
    name: bharatverify-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: FRONTEND_URL
        value: "https://bharatverify.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bharatverify-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3

databases:
  - name: bharatverify-db
    databaseName: bharatverify
    user: bharatverify
